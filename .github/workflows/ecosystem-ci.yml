name: Ecosystem CI

on:
  pull_request:
    paths: ["ecosystem/**", ".github/workflows/ecosystem-ci.yml"]
  push:
    branches: [main]
    paths: ["ecosystem/**", ".github/workflows/ecosystem-ci.yml"]

defaults:
  run:
    working-directory: ecosystem

jobs:
  build-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ecosystem/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm run test:all

  # No deploy step here by design: deploys are gated and run manually
  # (see ecosystem/ROADMAP.md and ecosystem/TESTING_CANONICAL.md). This
  # workflow only catches build/type/logic regressions on every PR and push.
