name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry
# (https://registry.modelcontextprotocol.io) using GitHub Actions OIDC.
#
# Why OIDC and not a personal `mcp-publisher login github`: the registry
# scopes a personal GitHub login's publish permission to
# `io.github.<username>/*` only, regardless of org membership visibility.
# Publishing under the org namespace (`io.github.delentia-labs/*`, matching
# server.json's "name" field) requires OIDC — the token's claims cryptographically
# prove this workflow is running inside a delentia-labs-owned repo, which the
# registry accepts as proof of org ownership.

on:
  push:
    branches: [main]
    paths:
      - "server.json"
      - ".well-known/mcp/server-card.json"
      - "package.json"
  workflow_dispatch: {}

permissions:
  id-token: write # required so the runner can request an OIDC token
  contents: read

jobs:
  publish:
    name: Validate and publish server.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Login via GitHub Actions OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
