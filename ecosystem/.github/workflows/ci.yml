name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm run test:all

  # No deploy step here by design — deploys are gated and run manually
  # (see ROADMAP.md / delentia-mcp-ecosystem/TESTING_CANONICAL.md). This
  # workflow's job is only to catch build/type/logic regressions on every
  # PR and push to main.
