# MCPize Configuration
# Docs: https://mcpize.com/docs/mcpize-yaml

version: 1

name: "delentia-mcp"
slug: "delentia-mcp"
description: "Stop rogue AI-agent tool calls before they run: a deterministic, policy-based allow/deny gate (FDIA) with a SHA-256 audit digest, plus structured reasoning (RCT-7), context compression (Delta) and Ed25519-signed task packets."

runtime: nodejs

build:
  install: "npm install"
  command: "npm run build"

start:
  type: stdio
  command: "node bin/cli.js"

bridge:
  mode: stdio
