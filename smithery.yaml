# Smithery configuration for Delentia Sovereign MCP
# https://smithery.ai/docs/config

name: delentia-mcp
description: Stop rogue AI-agent tool calls before they run. Deterministic policy gate (FDIA) with audit digest, 7-stage RCT-7 reasoning checklist, Delta context compression, and signed JITNA task packets.
version: 2.0.0
author: Ittirit Saengow (Chief Architect) - Delentia Labs <founder@delentia.com>
homepage: https://delentia.com
repository: https://github.com/delentia-labs/delentia-mcp

startCommand:
  type: stdio
  config:
    command: npx
    args:
      - -y
      - delentia-mcp
    env:
      DELENTIA_API_KEY: ""
