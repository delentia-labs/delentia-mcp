# Smithery configuration for Delentia Sovereign MCP
# https://smithery.ai/docs/config

name: delentia-mcp
description: Advisory MCP tools (policy score, 7-step reasoning checklist, deterministic context compression, signed task packets) hosted on Cloudflare Workers, reached through a stdio bridge. The tools are advisory: to enforce a policy on every tool call use delentia-guard.
version: 2.1.2
author: Ittirit Saengow (Chief Architect) - Delentia Labs <founder@delentia.com>
homepage: https://delentia.com
repository: https://github.com/delentia-labs/delentia-mcp

startCommand:
  type: stdio
  config:
    command: npx
    args:
      - -y
      - delentia-mcp
    env:
      DELENTIA_API_KEY: ""
