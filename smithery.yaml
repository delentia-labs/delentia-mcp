# Smithery configuration for Delentia Sovereign MCP
# https://smithery.ai/docs/config

name: delentia-mcp
description: Stop rogue AI-agent tool calls before they run. Deterministic policy gate (FDIA) with audit digest and Ed25519-signed human approval, 7-stage RCT-7 reasoning checklist, recoverable Delta context compression (compress_context + expand_context), and signed JITNA task packets.
version: 2.1.1
author: Ittirit Saengow (Chief Architect) - Delentia Labs <founder@delentia.com>
homepage: https://delentia.com
repository: https://github.com/delentia-labs/delentia-mcp

startCommand:
  type: stdio
  config:
    command: npx
    args:
      - -y
      - delentia-mcp
    env:
      DELENTIA_API_KEY: ""
